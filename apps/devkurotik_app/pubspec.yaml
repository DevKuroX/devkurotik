name: devkurotik_app
description: "DevKuroTik — Mobile-first Flutter rewrite of Mikhmon for MikroTik hotspot management."
publish_to: 'none'

version: 0.0.1+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management — approved baseline (Riverpod 2.x)
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation — approved baseline
  go_router: ^15.1.2

  # Local database — approved baseline (Drift + SQLite)
  drift: ^2.26.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0

  # Secure storage — approved baseline
  flutter_secure_storage: ^9.2.4

  # Charts — approved baseline
  fl_chart: ^0.71.0

  # PDF/Print — approved baseline
  pdf: ^3.11.3
  printing: ^5.14.3

  # QR — approved baseline
  qr_flutter: ^4.1.0

  # Notifications — approved baseline
  flutter_local_notifications: ^18.0.1

  # Biometric auth — approved baseline
  local_auth: ^2.3.0

  # MikroTik SDK — Phase 1 (local package)
  mikrotik_sdk:
    path: ../../packages/mikrotik_sdk

  # Share — Phase 5 (approved in MIGRATION_BLUEPRINT.md)
  share_plus: ^10.0.0

  # Icons
  cupertino_icons: ^1.0.8
  flutter_thermal_printer: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.14
  drift_dev: ^2.26.1
  riverpod_generator: ^2.6.5

  # Linting
  flutter_lints: ^6.0.0
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5

flutter:
  uses-material-design: true
